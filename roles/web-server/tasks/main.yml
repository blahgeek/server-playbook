- name: Remove legacy docker web services
  docker_container:
    name: "{{ item }}"
    state: absent
  with_items:
    - wedding99
  tags:
    - cleanup

- name: Remove legacy folders
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /var/wedding99
    - /var/nginx-proxy/html/wedding99
  tags:
    - cleanup

- name: Configure docker shlink
  docker_container:
    container_default_behavior: no_defaults
    restart_policy: unless-stopped
    name: shlink
    image: shlinkio/shlink:5
    env:
      IS_HTTPS_ENABLED: "false"
      INITIAL_API_KEY: "{{ shlink.api_key }}"
      DEFAULT_DOMAIN: "{{ shlink.domain }}"
      VIRTUAL_PORT: "8080"
      VIRTUAL_HOST: "{{ shlink.domain }}"
      LETSENCRYPT_HOST: "{{ shlink.domain }}"
    expose: 8080
  tags: shlink

- name: Configure docker blog website
  docker_container:
    container_default_behavior: no_defaults
    restart_policy: unless-stopped
    name: blog
    image: blahgeek/blog:20240812-2307
    env:
      VIRTUAL_PORT: "80"
      VIRTUAL_HOST: "blog.blahgeek.com,z1k.dev"
      LETSENCRYPT_HOST: "blog.blahgeek.com,z1k.dev"
    expose: 80
  tags: blog

